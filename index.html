<body style="background-color: rgb(102, 102, 102)">

    <h1 id="RedTotal"; style="color: rgb(168, 0, 0); position: absolute; top: 1%; left: 10%; align-content: center; text-align: center;">Red: 0</h1>
    <h1 id="GreenTotal"; style="color: rgb(0, 168, 0); position: absolute; top: 1%; left: 30%; align-content: center; text-align: center;">Green: 0</h1>
    <h1 id="BlueTotal"; style="color: rgb(0, 0, 168); position: absolute; top: 1%; left: 50%; align-content: center; text-align: center;">Blue: 0</h1>

    <button id="Roll" style="position: fixed; bottom: 2%; right: 2%; width: 10%; height: 10%; font-family: cursive; font-size: 250%; border-radius: 20px;"; onclick=" Roll()">Roll</button>

    <button id="RgbC" style="position: fixed; bottom: 15%; right: 2%; width: 35%; height: 10%; font-family: cursive; font-size: 300%; align-content: center; text-align: center; border-radius: 20px;"; onclick=" Copy()">Click Roll to start!</button>
    <h1 style="position: absolute; bottom: 30%; right: 10%; width: 15%; font-size: 150%;">Quick Tip! Click the RGB value to copy it to clipboard!</h1>
    <h1 style="position: absolute; bottom: 50%; right: 10%; width: 15%; font-size: 150%;">Quick Tip! Click on a coloured box to lock in its value!</h1>
</body>

<script>

    function CreateColumn(Colour, Offset, Name){
        for (let i=0; 43>i; i++){
            let newbutton = document.createElement("button");
            newbutton.textContent="0";
            newbutton.style = `
            height: 7%;
            width: 10%;
            position: absolute;
            top: ${i*8+8}%;
            left: ${Offset}%;
            font-Family: cursive;
            font-Size: 225%;
            background-Color: rgb(${Colour});
            Color: rgb(255,255,255);
            border-Radius: 15px`
            newbutton.id = `${Name+(Number(i)+1)}`;

            newbutton.onclick = function() {
                Click(this);
            };
            document.body.appendChild(newbutton);
        }
    }

    CreateColumn("200, 0, 0", 10, "Red")
    CreateColumn("0, 200, 0", 30, "Green")
    CreateColumn("0, 0, 200", 50, "Blue")

    function Click(btn){
        btn.locked = !btn.locked

        if (btn.locked){
            btn.style.opacity = "0.2";
        } else {
            btn.style.opacity = "1";
        }
    }

    function Roll(){

        function URolls(ColourName){
            document.getElementById(`${ColourName}Total`).textContent = `${ColourName}: 0`
            let T = 0;
            for (let i = 0; 43 > i; i++){
                let Subject = document.getElementById(`${ColourName+(Number(i)+1)}`);
                if (!Subject.locked){
                    Subject.textContent = Math.floor(Math.random()*10);
                    while (Subject.textContent>6){
                        Subject.textContent = Math.floor(Math.random()*10);
                    }
                }
                T = T + Number(Subject.textContent);
            };
            if (T>255){T=255};

            document.getElementById(`${ColourName}Total`).textContent = `${ColourName}: ${T}`;
            return(T);
        }

        document.getElementById("RgbC").textContent = `rgb(${URolls("Red")}`
        document.getElementById("RgbC").textContent += `, ${URolls("Green")}`
        document.getElementById("RgbC").textContent += `, ${URolls("Blue")})`

    }
    function Copy(){
        if (document.getElementById("RgbC").textContent != "Click Roll to start!"){
            navigator.clipboard.writeText(document.getElementById("RgbC").textContent)
        }
    }

</script>
